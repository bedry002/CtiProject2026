services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./Assets:/app/Assets:rw

  pipeline:
    build: .
    env_file: .env
    entrypoint: python main.py
    volumes:
      - ./Assets:/app/Assets:rw
      - ./reports:/app/reports
      - pipeline_data:/app/data

volumes:
  pipeline_data:
